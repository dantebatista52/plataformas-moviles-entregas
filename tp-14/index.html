<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Contactos - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Lista de Contactos</h1>
        <div class="card">
            <div class="card-body">
                <h2>Contactos</h2>

                <div class="d-flex flex-wrap gap-3 align-items-center mb-3">
                    <div>
                        <label for="orden-campo" class="form-label mb-1">Ordenar por</label>
                        <select id="orden-campo" class="form-select form-select-sm">
                            <option value="nombre" selected>Nombre</option>
                            <option value="apellido">Apellido</option>
                        </select>
                    </div>
                    <div class="form-check mt-3">
                        <input class="form-check-input" type="checkbox" id="solo-favoritos">
                        <label class="form-check-label" for="solo-favoritos">
                            Solo favoritos
                        </label>
                    </div>
                </div>

                <ul id="lista-contactos" class="list-group"></ul>

                <hr class="hr">

                <h2>Nuevo Contacto</h2>
                <form id="form-contacto">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" name="nombre" id="input-nombre" placeholder="Nombre" aria-label="Nombre" required>
                        <input type="text" class="form-control" name="apellido" id="input-apellido" placeholder="Apellido" aria-label="Apellido" required>
                        <input type="tel" class="form-control" name="telefono" id="input-telefono" placeholder="Teléfono" aria-label="Teléfono" required>
                    </div>
                    <button class="btn btn-primary" type="submit">Agregar Contacto</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let contactos = [
            {
                id: 1,
                nombre: 'Juan',
                apellido: 'Perez',
                telefono: '1155667788',
                favorito: false,
            },
        ];

        let criterioOrden = 'nombre';
        let verSoloFavoritos = false;

        /**
         * agregarContacto()
         * esta función se va a llamar cuando el usuario envía el formulario con el nuevo contacto para agregar.
         */
        function agregarContacto(nombre, apellido, telefono) {
            const nombreLimpio = nombre.trim();
            const apellidoLimpio = apellido.trim();
            const telefonoLimpio = telefono.trim();

            if (!nombreLimpio || !apellidoLimpio || !telefonoLimpio) {
                return;
            }

            contactos.push({
                id: Date.now(),
                nombre: nombreLimpio,
                apellido: apellidoLimpio,
                telefono: telefonoLimpio,
                favorito: false,
            });

            mostrarListado();
        }

        function alternarFavorito(id) {
            contactos = contactos.map((contacto) =>
                contacto.id === id
                    ? { ...contacto, favorito: !contacto.favorito }
                    : contacto
            );
            mostrarListado();
        }

        function obtenerContactosFiltradosYOrdenados() {
            const filtrados = verSoloFavoritos
                ? contactos.filter((contacto) => contacto.favorito)
                : [...contactos];

            return filtrados.sort((a, b) => {
                const valorA = (a[criterioOrden] || '').toLowerCase();
                const valorB = (b[criterioOrden] || '').toLowerCase();
                const comparacion = valorA.localeCompare(valorB, 'es', { sensitivity: 'base' });

                if (comparacion !== 0) {
                    return comparacion;
                }

                const desempateCampo = criterioOrden === 'nombre' ? 'apellido' : 'nombre';
                return (a[desempateCampo] || '').localeCompare(b[desempateCampo] || '', 'es', { sensitivity: 'base' });
            });
        }

        /**
         * mostrarListado()
         * esta función se encarga de mostrar en el DOM la lista de todos los contactos guardados en la variable global contactos.
         */
        function mostrarListado() {
            const lista = document.querySelector('#lista-contactos');
            lista.innerHTML = '';

            const contactosAMostrar = obtenerContactosFiltradosYOrdenados();

            if (contactosAMostrar.length === 0) {
                const itemVacio = document.createElement('li');
                itemVacio.className = 'list-group-item text-muted';
                itemVacio.textContent = verSoloFavoritos
                    ? 'No hay contactos favoritos para mostrar.'
                    : 'No hay contactos registrados.';
                lista.appendChild(itemVacio);
                return;
            }

            contactosAMostrar.forEach((contacto) => {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center';

                const info = document.createElement('div');
                info.innerHTML = `<strong>${contacto.nombre} ${contacto.apellido}</strong> — <span>${contacto.telefono}</span>`;

                const btnFavorito = document.createElement('button');
                btnFavorito.type = 'button';
                btnFavorito.className = contacto.favorito
                    ? 'btn btn-sm btn-warning'
                    : 'btn btn-sm btn-outline-secondary';
                btnFavorito.textContent = contacto.favorito ? '★ Favorito' : '☆ Favorito';
                btnFavorito.addEventListener('click', () => alternarFavorito(contacto.id));

                li.appendChild(info);
                li.appendChild(btnFavorito);
                lista.appendChild(li);
            });
        }

        function handlerFormulario(e) {
            e.preventDefault();
            const inputNombre = e.target.querySelector('#input-nombre');
            const inputApellido = e.target.querySelector('#input-apellido');
            const inputTelefono = e.target.querySelector('#input-telefono');

            const nombre = inputNombre.value;
            const apellido = inputApellido.value;
            const telefono = inputTelefono.value;

            inputNombre.value = '';
            inputApellido.value = '';
            inputTelefono.value = '';

            agregarContacto(nombre, apellido, telefono);
        }

        document.querySelector('form').addEventListener('submit', handlerFormulario);

        document.querySelector('#orden-campo').addEventListener('change', (e) => {
            criterioOrden = e.target.value;
            mostrarListado();
        });

        document.querySelector('#solo-favoritos').addEventListener('change', (e) => {
            verSoloFavoritos = e.target.checked;
            mostrarListado();
        });

        mostrarListado();
    </script>
</body>
</html>
