<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Compras - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Lista de Compras</h1>
        <div class="card">
            <div class="card-body">
                <h2>Listado de Productos</h2>

                <div class="mb-3 d-flex gap-2">
                    <button id="btn-ordenar" type="button" class="btn btn-outline-secondary btn-sm">Ordenar alfabéticamente</button>
                    <button id="btn-limpiar" type="button" class="btn btn-outline-danger btn-sm">Limpiar lista</button>
                </div>
                
                <ul id="lista-productos" class="list-group">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span>Pan</span>
                        <button type="button" class="btn btn-danger btn-sm btn-eliminar" aria-label="Eliminar Pan">Eliminar</button>
                    </li>
                </ul>

                <hr class="hr">

                <h2>Agregar Producto</h2>
                <form id="form-producto">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" aria-label="Nombre del Producto">
                        <button class="btn btn-primary" type="submit">Agregar Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const listaProductos = document.getElementById('lista-productos');
        const btnOrdenar = document.getElementById('btn-ordenar');
        const btnLimpiar = document.getElementById('btn-limpiar');

        function crearElementoProducto(nombreProducto) {
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';

            const span = document.createElement('span');
            span.textContent = nombreProducto;

            const btnEliminar = document.createElement('button');
            btnEliminar.type = 'button';
            btnEliminar.className = 'btn btn-danger btn-sm btn-eliminar';
            btnEliminar.textContent = 'Eliminar';
            btnEliminar.setAttribute('aria-label', `Eliminar ${nombreProducto}`);

            li.appendChild(span);
            li.appendChild(btnEliminar);
            return li;
        }

        /**
         * agregarProducto()
         * esta función se va a llamar cuando el usuario envía el formulario con el nombre del producto para agregar.
         */
        function agregarProducto(nombreProducto) {
            const nombreLimpio = nombreProducto.trim();
            if (!nombreLimpio) return;

            const item = crearElementoProducto(nombreLimpio);
            listaProductos.appendChild(item);
        }

        function limpiarLista() {
            listaProductos.innerHTML = '';
        }

        function ordenarProductos() {
            const items = Array.from(listaProductos.querySelectorAll('li'));
            items.sort((a, b) => {
                const textoA = a.querySelector('span').textContent.trim();
                const textoB = b.querySelector('span').textContent.trim();
                return textoA.localeCompare(textoB, 'es', { sensitivity: 'base' });
            });
            listaProductos.replaceChildren(...items);
        }

        function eliminarProducto(evento) {
            if (evento.target.classList.contains('btn-eliminar')) {
                const item = evento.target.closest('li');
                if (item) {
                    item.remove();
                }
            }
        }

        function handlerFormulario(evento) {
            evento.preventDefault();
            const input = evento.target.querySelector('input');
            const nombreProducto = input.value;
            input.value = "";
            agregarProducto(nombreProducto);
        }

        // Inicializa el botón de eliminar del producto inicial
        listaProductos.querySelectorAll('li').forEach((li) => {
            const texto = li.textContent.trim();
            const reemplazo = crearElementoProducto(texto);
            li.replaceWith(reemplazo);
        });

        document.querySelector('form').addEventListener('submit', handlerFormulario);
        btnLimpiar.addEventListener('click', limpiarLista);
        btnOrdenar.addEventListener('click', ordenarProductos);
        listaProductos.addEventListener('click', eliminarProducto);
    </script>
</body>
</html>
